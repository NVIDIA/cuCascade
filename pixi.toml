[workspace]
channels = ["conda-forge"]
name = "cuCascade"
platforms = ["linux-64", "linux-aarch64"]
requires-pixi = ">=0.59"

[dependencies]
cmake = "4.*"
cuda-nvcc = "*"
cuda-nvml-dev = "*"
cxx-compiler = "*"
doxygen = "*"
fmt = "*"
jinja2 = "*"
make = "*"
ninja = "*"
numactl = "*"
pre-commit = "*"
python = "*"
sccache = "*"
unzip = "*"

# CUDA 13
[feature.cuda-13]
system-requirements = { cuda = "13" }
dependencies = { "cuda-version" = "13.2.*" }
activation = { env = { CUDAARCHS = "75-real;80-real;86-real;90a-real;100f-real;120a-real;120" } }

# CUDA 12
[feature.cuda-12]
system-requirements = { cuda = "12.9" }
dependencies = { "cuda-version" = "12.9.*" }
activation = { env = { CUDAARCHS = "75-real;80-real;86-real;90a-real;100f-real" } }

# RMM (RAPIDS Memory Manager) -- cuCascade's only RAPIDS dependency. Provides the
# rmm CMake config consumed by find_package(rmm CONFIG). Previously pulled in
# transitively via libcudf; now depended on directly so the library (and tests)
# build without libcudf. Pin matches the RAPIDS release train; verify the exact
# available version with `pixi search -c rapidsai-nightly librmm` if the solve fails.
[feature.rmm-nightly]
channels = [{ channel = "rapidsai-nightly", priority = 1 }]
dependencies = { "librmm" = "26.08.*" }

[feature.rmm-stable]
channels = [{ channel = "rapidsai", priority = 1 }]
dependencies = { "librmm" = "26.06.*" }

[environments]
default = ["cuda-13", "rmm-nightly"]
cuda-13-nightly = ["cuda-13", "rmm-nightly"]
cuda-12-nightly = ["cuda-12", "rmm-nightly"]
cuda-13-stable = ["cuda-13", "rmm-stable"]
cuda-12-stable = ["cuda-12", "rmm-stable"]

[tasks]
build = "cmake --preset release && cmake --build build/release"
build-debug = "cmake --preset debug && cmake --build build/debug"
# Thin aliases matching the names referenced by issue #142's acceptance criteria.
cmake-release = "cmake --preset release"
build-release = "cmake --build build/release"
clean = "rm -rf build"
test = "cd build/release && ctest --output-on-failure"
benchmarks = "cd build/release && ./benchmark/cucascade_benchmarks"
lint = "pre-commit run -a"
lint-install = "pre-commit install"
docs = "doxygen Doxyfile && python scripts/generate_api_docs.py build/docs/xml docs/API_REFERENCE.md"

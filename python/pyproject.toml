[build-system]
build-backend = "scikit_build_core.build"
requires = [
    "scikit-build-core[pyproject]>=0.11.0",
    "cmake>=4.0",
    "cython>=3.0.0",
    "ninja",
]

[project]
name = "cucascade"
version = "0.1.0"
description = "Python bindings for cuCascade"
requires-python = ">=3.11"
dependencies = [
    "pylibcudf",
]

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
ninja.make-fallback = false
wheel.packages = ["cucascade"]


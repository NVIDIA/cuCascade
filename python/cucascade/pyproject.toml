[build-system]
build-backend = "scikit_build_core.build"
requires = [
    "cython>=3.0",
    "cython-cmake>=2.0",
    "pylibcudf",
    "scikit-build-core>=0.10",
]

[project]
name = "cucascade"
dynamic = ["version"]
description = "Read remote parquet files through cuCascade's REST backend and host-memory cache"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pylibcudf",
]
authors = [
    { name = "NVIDIA Corporation" },
]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[tool.scikit-build]
cmake.version = ">=3.26.4"
sdist.exclude = ["*tests*"]
sdist.reproducible = true
wheel.packages = ["cucascade"]
wheel.py-api = "cp312"
build-dir = "build/{wheel_tag}"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "cucascade/VERSION"
regex = "(?P<value>.*)"

[tool.pytest.ini_options]
addopts = "--tb=native --strict-config --strict-markers --import-mode=importlib"
filterwarnings = ["error"]
xfail_strict = true
testpaths = ["tests"]

# Bash-sourced TRUSTED configuration. Paths may contain spaces; labels may not.
# Run from the repository root, preferably inside `pixi shell`.
DEVICES=(0)
# label|filesystem class|actual mountpoint (findmnt -T DIR)|writable scratch directory
MOUNTS=("nvme|nvme|/mnt/disk_2|/mnt/disk_2/cucs-qualification")
FILE_MIB=4096
GDSIO_SIZES=(1 2 4 8)   # MiB
QD_LIST=(1 2 4 8 16 32 64 128)
GDSIO_THREADS=(1 2 4 8 16 32 64 128) # match QD_LIST
OP_LIST=(1 2 4 8 16)       # MiB; includes AM-5 2 MiB comparison
REGISTRATIONS=(slot arena)
ALLOW_WRITES=0           # enable B-2 write and B-6 spill; scratch preparation still writes
SECONDS_PER_CASE=30
CASE_TIMEOUT_S=600 # timeout + 60-second kill grace, per child
SOAK_MINUTES=60
RECREATE_EVERY_S=60
SAMPLE_EVERY_S=5
ENGINE_THREADS=(1 4 16)
ENGINE_QD=32
ENGINE_OP_MIB=4
ARENA_MIB=256
# Engine slot classes in MiB (comma-separated, members of 1,2,4,8; default 4). Must cover
# ENGINE_OP_MIB: use 8 (or 4,8) for GPFS with 8-MiB blocks. Size ARENA_MIB so that
# (ENGINE_QD + ceil(ENGINE_QD/4)) * class_MiB fits, e.g. QD 64 x 4 MiB needs >= 320 MiB.
ARENA_CLASSES=4
# Read-only per-port RX/TX snapshots and deltas around EVERY engine bench invocation.
# Includes legacy comparison arms. Shared host traffic is not cuFile attribution proof.
RECORD_NIC_COUNTERS=1
NIC_SYSFS_ROOT=/sys
# Set after operator validation; explicit overrides are NOT verified_direct evidence.
OPERATOR_OVERRIDE=0
QD_BIN=build/release/cucascade_cufile_async_qd
ENGINE_BIN=build/release/cucascade_cufile_engine_bench
GDSIO_BIN=/usr/local/cuda/gds/tools/gdsio
GDSCHECK_BIN=/usr/local/cuda/gds/tools/gdscheck
RESULTS_ROOT=results
